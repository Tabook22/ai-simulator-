# Neuron Lab — nginx location block
# Add this inside the HTTPS server block in /etc/nginx/sites-available/nasserdiary.conf,
# before the existing "location / { ... }" block.
# The API is proxied on localhost:8030; the built frontend is served from the clone.

location = /simulator {
    return 301 /simulator/;
}

location /simulator/api/ {
    proxy_pass http://127.0.0.1:8030/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 600s;
}

location /simulator/ {
    alias /home/nasser/apps/neuron-lab/frontend/dist/;
    try_files $uri $uri/ /simulator/index.html;
}
